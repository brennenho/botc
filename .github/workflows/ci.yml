name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage-url: ${{ steps.coverage-report.outputs.artifact-url }}
      summary: ${{ steps.coverage-summary.outputs.markdown }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Summarize unit test coverage
        id: coverage-summary
        if: ${{ !cancelled() }}
        run: node scripts/summarize-coverage-report.js coverage/coverage-summary.json

      - name: Upload coverage report
        id: coverage-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  security:
    name: dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  integration:
    name: multiplayer integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      report-url: ${{ steps.integration-report.outputs.artifact-url }}
      summary: ${{ steps.integration-summary.outputs.markdown }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install chromium webkit --with-deps

      - name: Start local Supabase
        run: pnpm supabase:start
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Reset local database
        run: pnpm supabase:reset
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Lint local database
        run: pnpm supabase:lint
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Test database behavior
        run: pnpm test:db
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Export local application environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=integration-disabled"
            echo "NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com"
            echo "NEXT_PUBLIC_DISABLE_OBSERVABILITY=true"
          } >> "$GITHUB_ENV"
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Build application for integration tests
        run: pnpm build

      - name: Run multiplayer integration tests
        run: pnpm test:integration

      - name: Summarize integration test results
        id: integration-summary
        if: ${{ !cancelled() }}
        run: node scripts/summarize-integration-report.js integration-results.json

      - name: Upload integration test report
        id: integration-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            integration-report/
            integration-results.json
            integration-test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm supabase:stop
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

  test-report-comment:
    name: test report comment
    needs: [tests, integration]
    if: >-
      ${{ always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Update test report comment
        uses: actions/github-script@v9
        env:
          COVERAGE_REPORT_URL: ${{ needs.tests.outputs.coverage-url }}
          COVERAGE_RESULT: ${{ needs.tests.result }}
          COVERAGE_SUMMARY: ${{ needs.tests.outputs.summary }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REPORT_URL: ${{ needs.integration.outputs.report-url }}
          INTEGRATION_SUMMARY: ${{ needs.integration.outputs.summary }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- botc-multiplayer-integration-report -->";
            const labels = {
              success: "✅ Passed",
              failure: "❌ Failed",
              cancelled: "⚪ Cancelled",
              skipped: "⚪ Skipped",
            };
            const coverageResult = labels[process.env.COVERAGE_RESULT] ?? "❓ Unknown";
            const integrationResult = labels[process.env.INTEGRATION_RESULT] ?? "❓ Unknown";
            const lastRunIso = new Date().toISOString();
            const lastRunFallback = lastRunIso
              .replace("T", " ")
              .replace(/\.\d{3}Z$/, " UTC");
            const coverageResource = process.env.COVERAGE_REPORT_URL
              ? `[View coverage report](${process.env.COVERAGE_REPORT_URL})`
              : "_No coverage artifact was produced._";
            const integrationResource = process.env.INTEGRATION_REPORT_URL
              ? `[View integration report & artifacts](${process.env.INTEGRATION_REPORT_URL})`
              : "_No integration report artifact was produced._";
            const body = [
              marker,
              "## Automated Test Results",
              "",
              `_Last run: <relative-time datetime="${lastRunIso}">${lastRunFallback}</relative-time>_`,
              "",
              "### Unit & Component Tests",
              "",
              `#### ${coverageResult}`,
              "",
              process.env.COVERAGE_SUMMARY || "_Coverage totals were unavailable._",
              "",
              coverageResource,
              "",
              "### Multiplayer Integration Tests",
              "",
              `#### ${integrationResult}`,
              "",
              process.env.INTEGRATION_SUMMARY || "_Detailed integration results were unavailable._",
              "",
              integrationResource,
              "",
              "---",
              "",
              `[View workflow run](${process.env.RUN_URL})`,
              "",
              "_Available report artifacts are retained for 14 days._",
            ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
